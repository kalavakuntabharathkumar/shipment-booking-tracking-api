services:
 postgres:
  image: postgres:16
  environment:
   POSTGRES_DB: shipment_db
   POSTGRES_USER: shipment
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  ports: ["5432:5432"]
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U shipment -d shipment_db"]
   interval: 5s
   timeout: 3s
   retries: 10
